name: Backend CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    env:
      LANGFUSE_TRACING_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
          version: "0.11.17"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy

      - name: Check module boundaries
        run: uv run lint-imports

      - name: Verify container build
        run: docker build --tag cosmos-server:test .

  deploy:
    name: Deploy development
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: cosmos-api-development
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push immutable image
        id: image
        env:
          IMAGE_URI: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/cosmos-server
        run: |
          docker build --tag "${IMAGE_URI}:${GITHUB_SHA}" .
          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          digest="$(gcloud artifacts docker images describe \
            "${IMAGE_URI}:${GITHUB_SHA}" \
            --format='value(image_summary.digest)')"
          echo "reference=${IMAGE_URI}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Deploy and verify
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          gcloud compute ssh "${{ vars.GCE_API_INSTANCE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --zone="${{ vars.GCE_API_ZONE }}" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo /opt/cosmos/bin/deploy-api '${IMAGE_REFERENCE}'"
